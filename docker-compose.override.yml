# /docker-compose.override.yml
services:
  backend:
    build: .
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
    networks:
      - default
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-pod_render}.rule=Host(`${APP_DOMAIN:-render.localhost}`)"
      - "traefik.http.routers.${APP_NAME:-pod_render}.entrypoints=web"
      - "traefik.http.services.${APP_NAME:-pod_render}.loadbalancer.server.port=3001"
      - "traefik.docker.network=proxy_network"

networks:
  proxy_network:
    external: true
    name: proxy_network
  internal_network_vps:
    external: true
    name: internal_network
