# /docker-compose.prod.yml
services:
  backend:
    build: .
    image: ${APP_IMAGE:-ghcr.io/quyle91/pod-render}:${APP_VERSION:-latest}
    restart: always
    environment:
      - NODE_OPTIONS=--max-old-space-size=6144
    volumes:
      - render_storage:/app/storage
    networks:
      - default
      - proxy_network_vps
      - internal_network_vps
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-pod_render}.rule=Host(`${PROD_DOMAIN:-render.quyle91.net}`)"
      - "traefik.http.routers.${APP_NAME:-pod_render}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-pod_render}.tls=true"
      - "traefik.http.routers.${APP_NAME:-pod_render}.tls.certresolver=myresolver"
      - "traefik.http.services.${APP_NAME:-pod_render}.loadbalancer.server.port=3001"
      - "traefik.docker.network=proxy_network_vps"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8192M

networks:
  default:
  proxy_network_vps:
    external: true
    name: proxy_network_vps
  internal_network_vps:
    external: true
    name: internal_network_vps

volumes:
  render_storage:
    name: ${VOLUME_STORAGE:-pod_render_storage}
    external: true
