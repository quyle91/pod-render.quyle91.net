# /docker-compose.yml
services:
  backend:
    container_name: ${APP_NAME:-pod_render}
    restart: always
    env_file:
      - .env
    volumes:
      - render_storage:/app/storage
    networks:
      - default
      - internal_network_vps

networks:
  default:
  internal_network_vps:
    external: true
    name: ${INTERNAL_NETWORK:-internal_network_vps}

volumes:
  render_storage:
    name: ${VOLUME_STORAGE:-pod_render_storage}
